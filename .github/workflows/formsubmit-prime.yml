name: Contact delivery diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/formsubmit-prime.yml"

permissions:
  contents: read

jobs:
  delivery-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify FlowForm email delivery endpoint
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl --silent --show-error \
            --output "$body" --dump-header "$headers" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Origin: https://www.twinlakesweb.com' \
            --data-urlencode 'name=CONTACT FORM DELIVERY TEST 20260907 - IGNORE' \
            --data-urlencode 'email=smoke-test@example.com' \
            --data-urlencode 'business=Twin Lakes Web Co automated diagnostic' \
            --data-urlencode 'project_details=This is an automated delivery test from GitHub Actions. It is not a customer lead.' \
            --data-urlencode '_subject=CONTACT FORM DELIVERY TEST 20260907 - IGNORE' \
            --data-urlencode '_replyto=smoke-test@example.com' \
            https://flowform.to/caseykeown@gmail.com)"
          echo "status=$code"
          tr -d '\r' < "$headers" | grep -Ei '^(access-control-allow-origin|content-type):' || true
          cat "$body"
          echo
          test "$code" -ge 200
          test "$code" -lt 300
          grep -Eq '"success"[[:space:]]*:[[:space:]]*true' "$body"
