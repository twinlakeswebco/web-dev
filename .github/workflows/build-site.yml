name: Build site

on:
  push:
    branches: [main]
    paths:
      - "blog/**.md"
      - "blog/**.markdown"
      - "blog/**.doc"
      - "blog/**.docx"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/build-site.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build static pages
        run: python3 scripts/build_site.py

      - name: Build blog, feed, and sitemap
        run: python3 scripts/build_blog.py

      - name: Check for retired brand references
        run: python3 scripts/check_brand.py

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html about contact services work blog/index.html blog/feed.xml blog/articles sitemap.xml *.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild site [skip ci]"
            git push
          fi
