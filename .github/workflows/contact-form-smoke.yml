name: Contact form smoke test

on:
  pull_request:
    paths:
      - "contact/**"
      - "templates/pages/contact*"
      - "scripts/leads.js"
      - ".github/workflows/contact-form-smoke.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contact-form-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Verify Turnstile migration in source
        shell: bash
        run: |
          set -euo pipefail
          script='templates/pages/contact.script.html'
          form='templates/pages/contact.html'

          grep -Fq 'https://challenges.cloudflare.com/turnstile/v0/api.js?compat=recaptcha' "$script" || {
            echo 'Cloudflare Turnstile compatibility script is missing.'
            exit 1
          }
          grep -Fq '0x4AAAAAAEr77nbJ4X_j3jyb' "$form" || {
            echo 'Expected Turnstile site key is missing from the contact form.'
            exit 1
          }
          if grep -Fq 'www.google.com/recaptcha/api.js' "$script"; then
            echo 'Google reCAPTCHA is still loaded by the contact form source.'
            exit 1
          fi
          if grep -Fq '6LcqDT4tAAAAACr0V9SAU5JCztMLIvz_1bM10jWb' "$form" "$script"; then
            echo 'Retired Google reCAPTCHA site key is still present.'
            exit 1
          fi

      - name: Verify generated contact page builds with Turnstile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_site.py
          grep -Fq 'id="lead-form"' contact/index.html
          grep -Fq 'https://leads-intake.caseykeown.workers.dev/' contact/index.html
          grep -Fq 'https://challenges.cloudflare.com/turnstile/v0/api.js?compat=recaptcha' contact/index.html
          grep -Fq '0x4AAAAAAEr77nbJ4X_j3jyb' contact/index.html
          if grep -Fq 'www.google.com/recaptcha/api.js' contact/index.html; then
            echo 'Generated contact page still loads Google reCAPTCHA.'
            exit 1
          fi

      - name: Verify live Worker rejects incomplete requests cleanly
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --silent --show-error --output "$body" \
            --write-out '%{http_code}' --request POST \
            --header 'Origin: https://www.twinlakesweb.com' \
            --form 'name=Twin Lakes Web Co smoke test' \
            --form 'email=smoke-test@example.com' \
            --form 'business=Automated smoke test' \
            --form 'business_description=Automated health check' \
            --form 'primary_purpose=Generate leads or quote requests' \
            --form 'primary_action=Test' \
            https://leads-intake.caseykeown.workers.dev/)"
          if [[ "$code" -ge 500 ]]; then
            echo "Worker returned server error HTTP $code"
            cat "$body"
            exit 1
          fi
          if [[ "$code" -lt 400 || "$code" -ge 500 ]]; then
            echo "Expected the Worker to reject the intentionally incomplete request with 4xx; got HTTP $code"
            cat "$body"
            exit 1
          fi
          echo "Worker is reachable and rejected the missing verification token as expected (HTTP $code)."

      - name: Verify live Worker CORS for Twin Lakes Web origins
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://leads-intake.caseykeown.workers.dev/'
          for origin in 'https://www.twinlakesweb.com' 'https://twinlakesweb.com'; do
            headers="$(mktemp)"
            code="$(curl --silent --show-error --output /dev/null --dump-header "$headers" \
              --write-out '%{http_code}' --request OPTIONS \
              --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              "$endpoint")"
            if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
              echo "Worker preflight returned HTTP $code for $origin"
              cat "$headers"
              exit 1
            fi
            allowed="$(tr -d '\r' < "$headers" | awk -F': ' 'tolower($1)=="access-control-allow-origin" {print $2}')"
            if [[ "$allowed" != "$origin" && "$allowed" != "*" ]]; then
              echo "Worker does not allow production origin: $origin"
              echo "Access-Control-Allow-Origin: ${allowed:-<missing>}"
              cat "$headers"
              exit 1
            fi
          done
