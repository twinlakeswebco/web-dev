name: Contact intake checks
on:
  pull_request:
    paths: ["contact/**", "templates/pages/contact*", "scripts/contact-intake*", "backend/intake/**", ".github/workflows/contact-form-smoke.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python3 scripts/build_site.py
      - run: node --test backend/intake/intake.test.mjs
      - name: Check generated form wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('contact/index.html').read_text()
          js = Path('scripts/contact-intake.js').read_text()
          assert 'id="photos"' in html and 'id="turnstile-widget"' in html
          assert '/scripts/contact-intake.js?v=20261017' in html
          assert 'flowform.to' not in html and 'leads-intake.caseykeown' not in html
          assert 'challenges.cloudflare.com/turnstile/v0/api.js' in js
          assert 'https://twinlakes-intake.caseykeown.workers.dev' in js
          PY
